[project]
name = "autoBot"
version = "0.1.0"
description = "Autonomous equities taker engine (Alpaca) — microstructure-aware multi-timeframe strategy library with regime allocation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Whrit" }]
dependencies = [
    "alembic>=1.18.1",
    "alpaca-py>=0.43.2",
    "asyncpg>=0.31.0",
    "celery>=5.6.2",
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "ipykernel>=7.1.0",
    "mypy>=1.19.1",
    "numpy>=2.4.1",
    "onnx>=1.20.1",
    "onnxruntime>=1.23.2",
    "pandas>=2.3.3",
    "polars>=1.37.1",
    "pre-commit>=4.5.1",
    "prometheus-client>=0.24.1",
    "pyarrow>=22.0.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "redis>=7.1.0",
    "rich>=14.2.0",
    "ruff>=0.14.12",
    "scikit-learn>=1.8.0",
    "sqlalchemy>=2.0.45",
    "structlog>=25.5.0",
    "types-requests>=2.32.4.20260107",
    "uvicorn[standard]>=0.40.0",
    "xgboost>=3.1.3",
]

[tool.uv]
# Keep the root as a non-package "workspace controller"
package = false

[tool.uv.workspace]
members = [
  "services/ingestor_py",
  "services/feature_builder_py",
  "services/labeler_py",
  "services/backtester_py",
  "services/optimizer_py",
  "services/registry_api_py",
  "services/monitor_py",
  "libs/common_types",
  "libs/cost_models",
  "libs/risk_models",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["common_types", "cost_models", "risk_models"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_any_generics = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
