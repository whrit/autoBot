[project]
name = "runner-py"
version = "0.1.0"
description = "Runner service for shadow and paper execution via Alpaca"
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.30.0",
    "httpx>=0.27.0",
    "polars>=1.0.0",
    "numpy>=2.0.0",
    "structlog>=24.0.0",
    "pyarrow>=15.0.0",
    "rich>=13.0.0",
    "common-types",
    "cost-models",
    "risk-models",
    "backtester-py",
]

[tool.uv]
package = true

[tool.uv.sources]
common-types = { workspace = true }
cost-models = { workspace = true }
risk-models = { workspace = true }
backtester-py = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
