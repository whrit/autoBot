[project]
name = "ingestor_py"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.30.0",
    "pyarrow>=15.0.0",
    "polars>=1.0.0",
    "structlog>=24.0.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "logging_utils",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
]

[tool.uv]
package = true

[tool.uv.sources]
logging_utils = { workspace = true }

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B", "A", "C4", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
